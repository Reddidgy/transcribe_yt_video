version: '3.3'

services:
  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: transcribe_backend
    ports:
      - "${PORT:-4520}:${PORT:-4520}"
    env_file:
      - .env
    volumes:
      - ./src/backend/api/logs:/app/api/logs
      - ./src/backend/api/user_visits_logs:/app/api/user_visits_logs
      - ./src/backend/transcribe_service/logs:/app/transcribe_service/logs
    restart: unless-stopped

# Volumes are mapped to host directories for persistence
